<!-- MathJax: write inline math as $$ ... $$ within a sentence, display math as $$ ... $$ on its own paragraph -->
<script>
  window.MathJax = { tex: { tags: 'ams' } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>

<!-- Show the sidebar photo uncropped (the theme's default is a small circle) -->
<style>
  .author__avatar img { max-width: 175px; border-radius: 4px; padding: 0; border: 0; }
</style>

<!-- Research overview: text on the left, thumbnail on the right -->
<style>
  .research-item { display: flex; align-items: center; gap: 1.5em; margin: 0 0 1.75em; }
  .research-item__text { flex: 1 1 0; min-width: 0; }
  .research-item__text h2 { margin-top: 0; }
  .research-item__thumb { flex: 0 0 200px; }
  .research-item__thumb img { display: block; width: 100%; border: 1px solid #e5e5e5; border-radius: 4px; }
  @media (max-width: 600px) {
    .research-item { flex-direction: column; align-items: flex-start; gap: 0.75em; }
    .research-item__thumb { flex: none; width: 100%; max-width: 280px; }
  }
</style>
